<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404｜ページが見つかりません</title>
<style>
  :root {
    --bg: #faf8f5;
    --text: #2b2b2b;
    --accent: #c96a4a;
    --muted: #8a8378;
    --line: #e0dad2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 2;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    padding: 60px 32px;
  }
  .code {
    font-size: 72px;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 600;
    line-height: 1;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.06em;
    margin-bottom: 20px;
  }
  p {
    font-size: 15px;
    color: #4a453e;
    margin-bottom: 40px;
  }
  .divider {
    width: 40px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 32px;
  }
  .btn {
    display: inline-block;
    padding: 14px 40px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 0.12em;
    border-radius: 2px;
    transition: opacity .2s, transform .2s;
  }
  .btn:hover { opacity: .85; transform: translateY(-1px); }
  @media (max-width: 600px) {
    .code { font-size: 56px; }
    .card { padding: 40px 20px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <div class="divider"></div>
    <h1>ページが見つかりません</h1>
    <p>
      お探しのページは存在しないか、<br>
      移動した可能性があります。
    </p>
    <a class="btn" href="/">表紙に戻る</a>
  </div>
</body>
</html>
