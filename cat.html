<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cat</title>
<style>
  :root {
    --bg: #faf8f5;
    --text: #2b2b2b;
    --accent: #c96a4a;
    --muted: #8a8378;
    --line: #e0dad2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 2;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    padding: 48px 32px;
  }

  /* ---- 猫 ---- */
  .cat {
    position: relative;
    width: 180px;
    height: 160px;
    margin: 0 auto 32px;
  }
  .cat .head {
    position: absolute;
    left: 50%;
    top: 30px;
    transform: translateX(-50%);
    width: 130px;
    height: 110px;
    background: #e8b96a;
    border-radius: 50% 50% 46% 46%;
  }
  .cat .ear {
    position: absolute;
    top: 6px;
    width: 0;
    height: 0;
    border-left: 26px solid transparent;
    border-right: 26px solid transparent;
    border-bottom: 44px solid #e8b96a;
  }
  .cat .ear.left { left: 18px; transform: rotate(-12deg); }
  .cat .ear.right { right: 18px; transform: rotate(12deg); }
  .cat .ear-inner {
    position: absolute;
    top: 14px;
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 26px solid #d99a4e;
  }
  .cat .ear-inner.left { left: 30px; transform: rotate(-12deg); }
  .cat .ear-inner.right { right: 30px; transform: rotate(12deg); }
  .cat .eye {
    position: absolute;
    top: 70px;
    width: 16px;
    height: 20px;
    background: #2b2b2b;
    border-radius: 50%;
  }
  .cat .eye.left { left: 42px; }
  .cat .eye.right { right: 42px; }
  .cat .nose {
    position: absolute;
    top: 92px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 9px solid #c96a4a;
  }
  .cat .mouth {
    position: absolute;
    top: 104px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 16px;
    border-bottom: 3px solid #2b2b2b;
    border-radius: 0 0 50% 50%;
  }
  .cat .whisker {
    position: absolute;
    top: 100px;
    width: 40px;
    height: 2px;
    background: #2b2b2b;
    opacity: .5;
  }
  .cat .whisker.l1 { left: -6px; transform: rotate(8deg); }
  .cat .whisker.l2 { left: -6px; top: 112px; transform: rotate(-8deg); }
  .cat .whisker.r1 { right: -6px; transform: rotate(-8deg); }
  .cat .whisker.r2 { right: -6px; top: 112px; transform: rotate(8deg); }

  /* ---- 文字とボタン ---- */
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }
  p {
    font-size: 15px;
    color: #4a453e;
    margin-bottom: 36px;
  }
  .buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    padding: 14px 40px;
    font-size: 15px;
    letter-spacing: 0.12em;
    border-radius: 2px;
    text-decoration: none;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    transition: opacity .2s, transform .2s, background .2s, color .2s;
  }
  .btn:hover { opacity: .85; transform: translateY(-1px); }
  .btn.secondary {
    background: transparent;
    color: var(--accent);
  }
  .btn.secondary:hover {
    background: var(--accent);
    color: #fff;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="cat">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="ear-inner left"></div>
      <div class="ear-inner right"></div>
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
        <div class="whisker l1"></div>
        <div class="whisker l2"></div>
        <div class="whisker r1"></div>
        <div class="whisker r2"></div>
      </div>
    </div>

    <h1>このページを削除しますか？</h1>
    <p>この猫はあなたの決定を待っています。</p>

    <div class="buttons">
      <a class="btn" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">同意</a>
      <a class="btn secondary" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">拒否</a>
    </div>
  </div>
</body>
</html>
