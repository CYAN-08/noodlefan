<style>
  :root {
    --bg: #faf8f5;
    --text: #2b2b2b;
    --accent: #c96a4a;
    --muted: #8a8378;
    --line: #e0dad2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 2;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 640px;
    width: 100%;
    text-align: center;
    padding: 60px 32px;
  }
  h1 {
    font-size: 28px;
    line-height: 1.5;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 28px;
  }
  .sub {
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
  }
  .desc {
    font-size: 15px;
    line-height: 2;
    color: #4a453e;
    margin-bottom: 48px;
    text-align: left;
  }
  .btn {
    display: inline-block;
    padding: 16px 48px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    letter-spacing: 0.12em;
    border-radius: 2px;
    transition: opacity .2s, transform .2s;
  }
  .btn:hover { opacity: .85; transform: translateY(-1px); }
  .divider {
    width: 40px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 32px;
  }
  @media (max-width: 600px) {
    h1 { font-size: 22px; }
    .card { padding: 40px 20px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>なんだよ、<br>別に好きじゃないんだからね！</h1>
    <div class="divider"></div>
    <p class="sub">幼い日の誤解と、九年間の練習の話</p>
    <p class="desc">
      六歳のとき、私をいじめてきたサム。<br>

    </p>

  </div>
