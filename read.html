<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本文｜なんだよ、別に好きじゃないんだからね！</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
  :root {
    --bg: #faf8f5;
    --text: #2b2b2b;
    --accent: #c96a4a;
    --muted: #8a8378;
    --line: #e0dad2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 2;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  header {
    padding: 40px 0 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  header a {
    display: inline-block;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.1em;
  }
  header a:hover { color: var(--accent); }

  main { padding: 48px 0 100px; }

  #loading {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 0;
    letter-spacing: 0.1em;
  }

  #content p {
    margin-bottom: 1.6em;
    text-indent: 1em;
  }
  #content h1, #content h2, #content h3 {
    font-size: 20px;
    margin: 2.4em 0 1.2em;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  #content h1:first-child, #content h2:first-child { margin-top: 0; }

  .error {
    color: #b33;
    font-size: 14px;
    line-height: 1.8;
    text-align: center;
    padding: 40px 0;
  }
  .error code {
    background: #f0ece6;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 13px;
  }

  @media (max-width: 600px) {
    body { font-size: 16px; line-height: 1.9; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>なんだよ、別に好きじゃないんだからね！</h1>
    <a href="index.html">← 表紙に戻る</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="loading">読み込み中……</div>
    <div id="content"></div>
  </div>
</main>

<script>
  const contentEl = document.getElementById('content');
  const loadingEl = document.getElementById('loading');

  fetch('1.docx')
    .then(res => {
      if (!res.ok) throw new Error('1.docx が見つかりません（HTTP ' + res.status + '）');
      return res.arrayBuffer();
    })
    .then(buffer => {
      return mammoth.convertToHtml({ arrayBuffer: buffer });
    })
    .then(result => {
      loadingEl.style.display = 'none';
      contentEl.innerHTML = result.value;
      if (result.messages.length) {
        console.warn('mammoth messages:', result.messages);
      }
    })
    .catch(err => {
      loadingEl.style.display = 'none';
      contentEl.innerHTML =
        '<p class="error">本文を読み込めませんでした。<br>' +
        '同じフォルダに <code>1.docx</code> が置かれているか確認してください。<br><br>' +
        '（' + err.message + '）</p>';
    });
</script>

</body>
</html>
